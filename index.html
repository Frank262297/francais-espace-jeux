<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Français – Espace jeux</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#172033;--muted:#667085;--accent:#e85d04;--accent2:#ffba08;--ok:#2a9d8f;--bad:#d62828}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#fff7ed,#fff1d6);color:var(--ink)}
header{padding:28px 18px;text-align:center;background:#fff;border-bottom:1px solid #eee}
h1{margin:0;font-size:clamp(28px,5vw,46px)} .sub{color:var(--muted);margin-top:6px}
.wrap{max-width:1050px;margin:auto;padding:22px}.levels,.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
button{border:0;border-radius:14px;padding:13px 15px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;box-shadow:0 4px 14px #0001}
button:hover{transform:translateY(-1px)}button.active,.primary{background:var(--accent);color:#fff}.game{padding:18px;text-align:left;min-height:100px}
.game b{display:block;font-size:18px;margin-bottom:5px}.panel{margin-top:18px;background:var(--card);border-radius:20px;padding:22px;box-shadow:0 8px 30px #00000012}
.hidden{display:none}.topline{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.score{font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:12px;margin-top:18px}
.tile,.word,.choice{border:2px solid #eee;background:#fff;border-radius:16px;padding:15px;text-align:center;cursor:pointer;min-height:72px}
.tile{font-size:38px}.tile small{display:block;font-size:13px;color:var(--muted)}.selected{border-color:var(--accent);background:#fff4e6}.matched{border-color:var(--ok);background:#e9fbf7;opacity:.7}
.choice{font-size:17px}.choice.correct{border-color:var(--ok);background:#e9fbf7}.choice.wrong{border-color:var(--bad);background:#fff0f0}
.big{font-size:clamp(22px,4vw,34px);font-weight:800;text-align:center;margin:22px 0}.sentence{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}.chip{padding:12px 16px;border-radius:12px;background:#f5f5f5;cursor:pointer;font-weight:700}
.answer{min-height:55px;border:2px dashed #ccc;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px}.feedback{text-align:center;font-weight:800;min-height:28px;margin:15px 0}
.progress{height:10px;background:#eee;border-radius:10px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}.tile,.word,.choice,.chip{overflow-wrap:anywhere}.chip:disabled{cursor:default}.puzzle-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}
input{width:100%;padding:13px;border:2px solid #ddd;border-radius:12px;font-size:17px}.footer{text-align:center;color:var(--muted);padding:20px}

.story-text{font-size:18px;line-height:1.75;max-width:750px;margin:18px auto}.story-text p{margin:0 0 14px}.activity-controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.media-status{color:var(--muted);font-size:14px;min-height:22px}.story-options{display:grid;gap:12px}.story-options .choice{text-align:left;line-height:1.5;width:100%}.question-number{color:var(--muted);font-weight:700}.story-heading{font-size:25px;margin:20px 0 12px}.cinema-stage{overflow:hidden;position:relative;border-radius:18px;min-height:180px;background:linear-gradient(#c8e9ff 65%,#d5ebbc 65%);display:flex;justify-content:center;align-items:flex-end;gap:24px;padding:25px}.scene-place{position:absolute;font-size:75px;left:50%;top:10px;transform:translateX(-50%);opacity:.65}.actor{font-size:65px;z-index:1;animation:actor-enter .6s ease-out both}.actor:nth-child(3){animation-delay:.12s}.actor.speaking{animation:actor-talk 1.4s ease-in-out infinite}.scene-caption{font-size:18px;line-height:1.7;border:2px solid #ffba08;border-radius:16px;background:#fffdf3;padding:18px;margin-top:14px}.reading-tip{background:#fff4e6;border-radius:12px;padding:12px;line-height:1.6}button:disabled{opacity:.55;transform:none;cursor:default}@keyframes actor-enter{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes actor-talk{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-7px)}}@media(prefers-reduced-motion:reduce){.actor,.actor.speaking{animation:none}}@media(max-width:400px){.wrap{padding:14px}.panel{padding:15px}.actor{font-size:52px}.story-text,.scene-caption{font-size:17px}}
.film-frame{display:block;border:0;border-radius:18px;width:100%;height:820px;background:#173638}@media(max-width:600px){.film-frame{height:690px}}
</style>
</head>
<body>
<header><h1>🇫🇷 Français – Espace jeux</h1><div class="sub">Apprendre en jouant · Wortschatz, Grammatik und Sprachgefühl</div></header>
<div class="wrap">
<h2>1. Schwierigkeitsgrad</h2>
<div class="levels">
<button class="lvl active" data-l="1">🌱 Stufe 1<br><small>Grundlagen</small></button>
<button class="lvl" data-l="2">🚀 Stufe 2<br><small>Aufbau</small></button>
<button class="lvl" data-l="3">🧠 Stufe 3<br><small>Fortgeschritten</small></button>
<button class="lvl" data-l="4">🏆 Stufe 4<br><small>Challenge</small></button>
</div>
<h2>2. Wähle ein Spiel</h2>
<div class="games">
<button class="game" onclick="start('match')"><b>🖼️ Bild & Wort</b>Finde die passenden Paare.</button>
<button class="game" onclick="start('odd')"><b>🕵️ Eindringling</b>Welches Wort passt nicht?</button>
<button class="game" onclick="start('puzzle')"><b>🧩 Satz-Puzzle</b>Baue den Satz richtig zusammen.</button>
<button class="game" onclick="start('detective')"><b>🔎 Fehlerdetektiv</b>Finde die richtige Form.</button>
<button class="game" onclick="start('guess')"><b>❓ Qui suis-je ?</b>Errate das Wort aus Hinweisen.</button>
<button class="game" onclick="start('reading')"><b>📖 Histoires</b>Lies eine Geschichte und löse drei Fragen.</button>
<button class="game" onclick="start('summary')"><b>📝 Résumé</b>Welche Zusammenfassung stimmt?</button>
<button class="game" onclick="start('listening')"><b>🎧 Écoute</b>Höre eine Geschichte und beantworte Fragen.</button>
<button class="game" onclick="start('cinema')"><b>🎬 Mini-Geschichte</b>Verschiedene Trickfilme mit Dialogen und Fragen.</button>
<button class="game" onclick="start('mission')"><b>💬 Ta mission</b>Was sagst du in dieser Situation?</button>
<button class="game" onclick="surprise()"><b>🎲 Überrasch mich!</b>Ein zufälliges Spiel wartet auf dich.</button>
</div>
<div id="panel" class="panel hidden">
<div class="topline"><button onclick="home()">← Spiele</button><div class="score">⭐ Punkte: <span id="score">0</span></div></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="content"></div><div id="fb" class="feedback" role="status" aria-live="polite"></div>
</div>
</div><div class="footer">On y va ! Fehler gehören zum Lernen. 💪</div>
<script>
let level=1,score=0,round=0,game='',selected=null,answer=[];
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lvl').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=+b.dataset.l;if(game)start(game)});
const vocab=[[{"e": "🏠", "w": "la maison"}, {"e": "🚗", "w": "la voiture"}, {"e": "⚽", "w": "le ballon"}, {"e": "👨", "w": "l’homme"}, {"e": "🐶", "w": "le chien"}, {"e": "🍎", "w": "la pomme"}, {"e": "🐱", "w": "le chat"}, {"e": "🐴", "w": "le cheval"}, {"e": "🐟", "w": "le poisson"}, {"e": "🐦", "w": "l’oiseau"}, {"e": "🌳", "w": "l’arbre"}, {"e": "🌸", "w": "la fleur"}, {"e": "☀️", "w": "le soleil"}, {"e": "🌙", "w": "la lune"}, {"e": "⭐", "w": "l’étoile"}, {"e": "🍌", "w": "la banane"}, {"e": "🍐", "w": "la poire"}, {"e": "🍞", "w": "le pain"}, {"e": "🧀", "w": "le fromage"}, {"e": "🥛", "w": "le lait"}, {"e": "👟", "w": "la chaussure"}, {"e": "👕", "w": "le tee-shirt"}, {"e": "📖", "w": "le livre"}, {"e": "✏️", "w": "le crayon"}], [{"e": "✈️", "w": "l’avion"}, {"e": "🏫", "w": "l’école"}, {"e": "🍽️", "w": "l’assiette"}, {"e": "🌧️", "w": "la pluie"}, {"e": "📚", "w": "les livres"}, {"e": "🚲", "w": "le vélo"}, {"e": "🚂", "w": "le train"}, {"e": "🚢", "w": "le bateau"}, {"e": "🚌", "w": "le bus"}, {"e": "🏥", "w": "l’hôpital"}, {"e": "🏖️", "w": "la plage"}, {"e": "⛰️", "w": "la montagne"}, {"e": "🌉", "w": "le pont"}, {"e": "🧳", "w": "la valise"}, {"e": "☂️", "w": "le parapluie"}, {"e": "🔑", "w": "la clé"}, {"e": "⌚", "w": "la montre"}, {"e": "📱", "w": "le téléphone"}, {"e": "💻", "w": "l’ordinateur"}, {"e": "🪑", "w": "la chaise"}, {"e": "🛏️", "w": "le lit"}, {"e": "🪟", "w": "la fenêtre"}, {"e": "🚪", "w": "la porte"}, {"e": "🧊", "w": "la glace"}], [{"e": "🚲➡️🏫", "w": "aller à l’école à vélo"}, {"e": "📖👀", "w": "lire un livre"}, {"e": "🎧🎵", "w": "écouter de la musique"}, {"e": "🍳🥘", "w": "préparer un repas"}, {"e": "🛒🍎", "w": "acheter des fruits"}, {"e": "🧹🏠", "w": "nettoyer la maison"}, {"e": "🐕🚶", "w": "promener le chien"}, {"e": "🏊💧", "w": "nager dans la piscine"}, {"e": "⚽🥅", "w": "jouer au football"}, {"e": "✍️✉️", "w": "écrire une lettre"}, {"e": "📞👵", "w": "appeler sa grand-mère"}, {"e": "🪥🦷", "w": "se brosser les dents"}, {"e": "🧼👐", "w": "se laver les mains"}, {"e": "🌱💧", "w": "arroser une plante"}, {"e": "📸🌄", "w": "prendre une photo"}, {"e": "🎸🎵", "w": "jouer de la guitare"}, {"e": "💃🎵", "w": "danser"}, {"e": "🛏️😴", "w": "dormir"}, {"e": "🏃🌳", "w": "courir dans le parc"}, {"e": "🚗🛣️", "w": "conduire une voiture"}, {"e": "🚂🧳", "w": "voyager en train"}, {"e": "🥾⛰️", "w": "marcher en montagne"}, {"e": "🍽️🧽", "w": "faire la vaisselle"}, {"e": "🎂🎉", "w": "fêter un anniversaire"}], [{"e": "🚫📱🚗", "w": "ne pas utiliser son téléphone au volant"}, {"e": "♻️🗑️", "w": "trier les déchets"}, {"e": "🚰🚫", "w": "fermer le robinet"}, {"e": "💡🚫", "w": "éteindre la lumière"}, {"e": "🌳🌱", "w": "planter un arbre"}, {"e": "🩹🦵", "w": "soigner une blessure"}, {"e": "🩼🚶", "w": "marcher avec des béquilles"}, {"e": "🧑‍🚒🔥", "w": "éteindre un incendie"}, {"e": "🧑‍⚕️🩺", "w": "examiner un patient"}, {"e": "🧑‍🏫📝", "w": "corriger un examen"}, {"e": "🧑‍🍳🔪🥕", "w": "couper les légumes"}, {"e": "🧵🪡👕", "w": "coudre un tee-shirt"}, {"e": "🔨🪑", "w": "réparer une chaise"}, {"e": "🎁📦", "w": "emballer un cadeau"}, {"e": "⚖️🍎", "w": "peser les fruits"}, {"e": "🌡️🤒", "w": "prendre sa température"}, {"e": "🔭🌙", "w": "observer la lune"}, {"e": "🔬🧪", "w": "faire une expérience"}, {"e": "🤝📝", "w": "signer un accord"}, {"e": "💳🛒", "w": "payer par carte"}, {"e": "🛂🧳", "w": "montrer son passeport"}, {"e": "🗺️🧭", "w": "se repérer avec une carte"}, {"e": "🧗⛰️", "w": "escalader une montagne"}, {"e": "🤿🐠", "w": "plonger dans la mer"}]];
const pictureDecks=[[],[],[],[]];
const previousPictures=[[],[],[],[]];
function shuffled(values){const result=[...values];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function nextPictures(){const index=level-1;if(pictureDecks[index].length<6){const previous=new Set(previousPictures[index]);const fresh=shuffled(vocab[index].filter(x=>!previous.has(x.w)));const recent=shuffled(vocab[index].filter(x=>previous.has(x.w)));pictureDecks[index]=fresh.concat(recent)}const items=pictureDecks[index].splice(0,6);previousPictures[index]=items.map(x=>x.w);return shuffled(items)}
const odds=[[["chien", "chat", "cheval", "table"], ["lundi", "mardi", "jeudi", "chaussure"]], [["manger", "boire", "dormir", "bleu"], ["janvier", "avril", "juin", "dimanche"]], [["a parlé", "a mangé", "est allé", "vivait"], ["toujours", "jamais", "souvent", "chaise"]], [["cependant", "pourtant", "néanmoins", "fourchette"], ["avait vu", "avait pris", "était parti", "ira"]]];
const puzzles=[["Je vis à Paris.", "Je vis à Paris ."], ["Ma sœur a un chien.", "Ma sœur a un chien ."], ["Hier, nous sommes allés au cinéma.", "Hier , nous sommes allés au cinéma ."], ["Que vas-tu faire demain ?", "Que vas-tu faire demain ?"], ["Quand j’étais petit, je jouais au football.", "Quand j’étais petit , je jouais au football ."], ["Je ne l’ai pas acheté parce qu’il était trop cher.", "Je ne l’ai pas acheté parce qu’il était trop cher ."], ["Si j’avais plus de temps, j’apprendrais l’italien.", "Si j’avais plus de temps , j’apprendrais l’italien ."], ["Bien qu’il ait plu, nous sommes sortis.", "Bien qu’il ait plu , nous sommes sortis ."]];
const detective=[[["J’ai douze ans.", "Je suis douze ans."], ["Elle aime les pommes.", "Elle aimes les pommes."]], [["Nous sommes allés au parc hier.", "Nous avons allé au parc hier."], ["J’ai pris mon petit-déjeuner.", "J’ai prend mon petit-déjeuner."]], [["Pendant que je lisais, le téléphone a sonné.", "Pendant que je lisait, le téléphone a sonné."], ["Elle me l’a donné.", "Elle l’a donné à je."]], [["Si j’avais su, je serais resté chez moi.", "Si j’aurais su, je serais resté chez moi."], ["Il faut que tu viennes.", "Il faut que tu viens."]]];
const guesses=[[{"h": "Je suis ton logement. J’ai des pièces et une porte. Mon nom commence par m.", "a": "maison"}, {"h": "J’ai quatre roues. On me conduit sur la route. Mon nom commence par v.", "a": "voiture"}], [{"h": "Je suis une personne qui enseigne à l’école. Mon nom commence par p.", "a": "professeur", "accept": ["professeure", "prof"]}, {"h": "On m’ouvre au-dessus de la tête quand il pleut. Mon nom commence par p.", "a": "parapluie"}], [{"h": "Je ne suis ni hier ni demain. Je suis…", "a": "aujourd’hui"}, {"h": "Dans un match, je suis le contraire de perdre.", "a": "gagner"}], [{"h": "Je signifie comprendre soudainement quelque chose : se rendre… Mon nom commence par c.", "a": "compte"}, {"h": "Je signifie atteindre un objectif grâce à ses efforts. Mon nom commence par r.", "a": "réussir"}]];
let advancing=false, pendingTimer=null, puzzleWords=[], currentPuzzle=null, currentGuess=null;
function cancelAdvance(){stopMedia();if(pendingTimer!==null)clearTimeout(pendingTimer);pendingTimer=null;advancing=false}
function scheduleNext(delay){pendingTimer=setTimeout(()=>{pendingTimer=null;round++;next()},delay)}
function start(g){cancelAdvance();game=g;score=0;round=0;document.getElementById('panel').classList.remove('hidden');document.querySelector('.games').style.display='none';document.getElementById('score').textContent=score;next()}
function surprise(){start(shuffled(['match','odd','puzzle','detective','guess','reading','summary','listening','cinema','mission'])[0])}
function home(){cancelAdvance();game='';selected=null;document.getElementById('panel').classList.add('hidden');document.querySelector('.games').style.display='grid'}
function fb(t,ok){let f=document.getElementById('fb');f.textContent=t;f.style.color=ok?'var(--ok)':'var(--bad)'}
function clearChoices(){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('wrong','correct'))}
function win(){if(advancing)return;advancing=true;score+=10;document.getElementById('score').textContent=score;fb('Bravo ! +10 ⭐',true);scheduleNext(1000)}
function next(){cancelAdvance();document.getElementById('bar').style.width=((round%5)/5*100)+'%';fb('',true);const games={match,odd,puzzle,detective:detect,guess,reading:()=>storyActivity('reading'),summary:()=>storyActivity('summary'),listening:()=>storyActivity('listening'),cinema:()=>storyActivity('cinema'),mission};if(games[game])games[game]()}
function button(text,cls,action){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.onclick=()=>action(b);return b}
function match(){let items=nextPictures();document.getElementById('content').innerHTML='<div class="big">Verbinde Bild und französisches Wort</div><div id="pictures" class="grid"></div><div id="words" class="grid"></div>';items.forEach(x=>{const b=button(x.e,'tile',pickImg);b.dataset.w=x.w;b.setAttribute('aria-label','Bild '+(document.getElementById('pictures').children.length+1));document.getElementById('pictures').appendChild(b)});shuffled(items).forEach(x=>{const b=button(x.w,'word',pickWord);b.dataset.w=x.w;document.getElementById('words').appendChild(b)});selected=null}
function pickImg(e){if(advancing||e.classList.contains('matched'))return;document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');selected=e;fb('Wähle das passende französische Wort.',true)}
function pickWord(e){if(advancing||e.classList.contains('matched'))return;if(!selected)return fb('Wähle zuerst ein Bild.',false);if(e.dataset.w===selected.dataset.w){e.classList.add('matched');selected.classList.remove('selected');selected.classList.add('matched');e.disabled=true;selected.disabled=true;score+=3;document.getElementById('score').textContent=score;fb('Bonne réponse !',true);selected=null;if(document.querySelectorAll('.word:not(.matched)').length===0){advancing=true;scheduleNext(1000)}}else fb('Noch nicht – wähle ein anderes Wort oder Bild.',false)}
function odd(){let q=odds[level-1][round%odds[level-1].length],correct=q[q.length-1];document.getElementById('content').innerHTML='<div class="big">🕵️ Welches Wort passt nicht?</div><div class="grid" id="choices"></div>';shuffled(q).forEach(x=>document.getElementById('choices').appendChild(button(x,'choice',el=>chooseOdd(el,x,correct))))}
function chooseOdd(el,x,a){if(advancing)return;clearChoices();if(x===a){el.classList.add('correct');win()}else{el.classList.add('wrong');fb('Das gehört zur Gruppe. Versuch es noch einmal.',false)}}
function puzzle(){currentPuzzle=puzzles[(level-1)*2+round%2];puzzleWords=shuffled(currentPuzzle[1].split(' '));answer=[];document.getElementById('content').innerHTML='<div class="big">🧩 Baue den französischen Satz</div><p>Tippe auf ein Wort im Satz, um es zurückzulegen.</p><div id="ans" class="answer"></div><div id="wordBank" class="sentence"></div><div class="puzzle-actions" id="puzzleActions"></div>';document.getElementById('puzzleActions').appendChild(button('Prüfen','primary',()=>checkPuzzle()));document.getElementById('puzzleActions').appendChild(button('Neu beginnen','',resetPuzzle));renderPuzzle()}
function renderPuzzle(){const bank=document.getElementById('wordBank'),ans=document.getElementById('ans');bank.replaceChildren();ans.replaceChildren();puzzleWords.forEach((w,i)=>{if(!answer.includes(i))bank.appendChild(button(w,'chip',()=>addWord(i)))});answer.forEach((i,pos)=>ans.appendChild(button(puzzleWords[i],'chip',()=>removeWord(pos))))}
function addWord(i){if(advancing||answer.includes(i))return;answer.push(i);fb('',true);renderPuzzle()}
function removeWord(pos){if(advancing)return;answer.splice(pos,1);fb('',true);renderPuzzle()}
function resetPuzzle(){if(advancing)return;answer=[];fb('',true);renderPuzzle()}
function sentence(words){return words.join(' ').replace(/\s+([.,])/g,'$1').replace(/([¿¡])\s+/g,'$1')}
const puzzleAlternatives=[["Je vis à Paris."], ["Ma sœur a un chien."], ["Hier, nous sommes allés au cinéma.", "Nous sommes allés au cinéma hier."], ["Que vas-tu faire demain ?"], ["Quand j’étais petit, je jouais au football."], ["Je ne l’ai pas acheté parce qu’il était trop cher."], ["Si j’avais plus de temps, j’apprendrais l’italien."], ["Bien qu’il ait plu, nous sommes sortis."]];
function checkPuzzle(){if(advancing)return;if(answer.length!==puzzleWords.length)return fb('Verwende zuerst alle Wörter und Satzzeichen.',false);const actual=sentence(answer.map(i=>puzzleWords[i]));const alternatives=puzzleAlternatives[puzzles.indexOf(currentPuzzle)];if(alternatives.some(x=>x.toLocaleLowerCase('fr')===actual.toLocaleLowerCase('fr')))win();else fb('Die Reihenfolge stimmt noch nicht. Tippe Wörter an, um sie zu ändern.',false)}
function detect(){let pair=detective[level-1][round%detective[level-1].length];document.getElementById('content').innerHTML='<div class="big">🔎 Welcher Satz ist korrekt?</div><div class="grid" id="choices"></div>';shuffled(pair).forEach(x=>document.getElementById('choices').appendChild(button(x,'choice',el=>checkDetect(el,x,pair[0]))))}
function checkDetect(el,x,a){if(advancing)return;clearChoices();if(x===a){el.classList.add('correct');win()}else{el.classList.add('wrong');fb('Da steckt ein Fehler drin. Versuch es noch einmal.',false)}}
function guess(){currentGuess=guesses[level-1][round%guesses[level-1].length];document.getElementById('content').innerHTML='<div class="big">❓ Qui suis-je ?</div><p id="hint" style="text-align:center;font-size:20px"></p><label for="guessInput">Deine französische Antwort:</label><input id="guessInput" placeholder="Écris le mot…" autocomplete="off"><p id="guessAction" style="text-align:center"></p>';document.getElementById('hint').textContent=currentGuess.h;document.getElementById('guessInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkGuess()}};document.getElementById('guessAction').appendChild(button('Antwort prüfen','primary',checkGuess))}
function normalizeGuess(value){return value.normalize('NFC').replace(/[’‘]/g, "'").trim().toLocaleLowerCase('fr').replace(/\s+/g,' ').replace(/^(le|la|les|un|une|des) /,'').replace(/[.!?]+$/,'')}
function checkGuess(){if(advancing)return;const v=normalizeGuess(document.getElementById('guessInput').value);if(!v)return fb('Gib zuerst eine Antwort ein.',false);if([currentGuess.a,...(currentGuess.accept||[])].some(x=>normalizeGuess(x)===v))win();else fb('Noch nicht. Denk an die Hinweise und versuch es erneut.',false)}

jouent aux cartes", "Ils préparent un autre panier"], 1]], "summaries": ["Ben et sa mère font un pique-nique dans le salon parce qu’il pleut. Ensuite, ils jouent aux cartes.", "Ben va seul au parc et attend sa mère sous la pluie.", "Ils mangent au restaurant parce qu’il n’y a rien à manger chez eux."], "place": "🏡", "actors": ["👦", "👩"]}], [{"title": "Une batterie vide", "scenes": ["Vendredi, Sarah avait rendez-vous avec son cousin Mathieu devant le musée à seize heures. Avant de partir, elle a utilisé son téléphone pour chercher un magasin et écouter de la musique. Elle n’a pas vérifié la batterie.", "Quand elle est arrivée au centre-ville, son téléphone s’est éteint. Elle ne pouvait plus consulter le plan ni appeler Mathieu. Au début, elle était inquiète, mais elle se souvenait du nom du musée.", "Elle est entrée dans une boulangerie et a demandé son chemin. Le vendeur lui a conseillé d’aller tout droit, puis de tourner à droite après la bibliothèque. Sarah a suivi ses indications.", "Elle est arrivée avec dix minutes de retard. Mathieu l’attendait. Ils ont visité le musée, puis ont bu un chocolat chaud. Sarah a décidé d’emporter un petit plan en papier la prochaine fois."], "q": [["Pourquoi Sarah ne peut-elle pas appeler Mathieu ?", ["Elle a perdu son numéro", "La batterie de son téléphone est vide", "Le musée est fermé"], 1], ["Qui lui indique le chemin ?", ["Mathieu", "Le vendeur d’une boulangerie", "Un conducteur"], 1], ["Comment se termine l’après-midi ?", ["Ils visitent le musée ensemble", "Sarah rentre sans voir Mathieu", "Mathieu achète un téléphone"], 0]], "summaries": ["Le téléphone de Sarah s’éteint. Elle demande son chemin dans une boulangerie et rejoint Mathieu au musée avec un peu de retard.", "Sarah perd son téléphone au musée et Mathieu rentre sans elle.", "Le vendeur recharge le téléphone et conduit Sarah au musée."], "place": "🏙️", "actors": ["👩", "👨"]}, {"title": "Le vélo emprunté", "scenes": ["Dimanche, Emma voulait aller au marché. Son vélo avait un pneu crevé. Son voisin Bruno lui a donc prêté le sien. Il lui a demandé de le rapporter avant dix-huit heures.", "Emma a acheté des oranges et du pain. Ensuite, elle est passée par le parc et a rencontré une amie. Elles ont discuté un moment sans voir le temps passer.", "À dix-sept heures trente, Emma a regardé sa montre. Elle est partie immédiatement, mais une rue était fermée sur le chemin du retour. Elle a dû faire un détour.", "Elle est arrivée à dix-sept heures cinquante-cinq. Bruno était encore chez lui. Emma lui a rendu le vélo et lui a offert deux oranges pour le remercier. Elle a décidé de réparer son pneu lundi."], "q": [["Pourquoi Emma emprunte-t-elle un vélo ?", ["Son vélo a un pneu crevé", "Elle veut vendre son vélo", "Elle ne peut pas marcher"], 0], ["Qu’est-ce qui la retarde après le parc ?", ["Une rue fermée", "Un examen", "Un orage"], 0], ["Rend-elle le vélo à temps ?", ["Non, le lendemain", "Oui, cinq minutes avant dix-huit heures", "Non, à dix-neuf heures"], 1]], "summaries": ["Emma emprunte le vélo de Bruno pour aller au marché. Malgré une discussion et un détour, elle le rapporte à temps.", "Emma casse le vélo de Bruno et en achète un autre au marché.", "Bruno accompagne Emma au parc et ils rentrent tous les deux en retard."], "place": "🌳", "actors": ["👧", "👦"]}], [{"title": "Le jardin sur le toit", "scenes": ["Dans l’immeuble de Julie, il y avait une terrasse sur le toit que presque personne n’utilisait. Elle a proposé d’en transformer une partie en petit jardin. Certains voisins étaient enthousiastes, mais d’autres craignaient des dépenses importantes et des problèmes d’eau.", "Avant d’acheter quoi que ce soit, Julie a organisé une réunion. Un voisin technicien a expliqué qu’il fallait vérifier le poids que le toit pouvait supporter. Ils ont aussi décidé de demander une autorisation et de commencer avec quelques pots.", "Une fois l’autorisation obtenue et les vérifications terminées, ils ont planté des salades et des herbes aromatiques. Ils ont établi un planning d’arrosage. Pendant les vacances, pourtant, deux personnes sont parties sans prévenir les autres.", "Plusieurs plantes ont séché. Au lieu d’abandonner le jardin, les voisins ont amélioré leur système : pour chaque tour d’arrosage, il y aurait un responsable et un remplaçant. Julie a compris qu’une bonne idée avait aussi besoin d’une organisation claire."], "q": [["Que font-ils avant de planter ?", ["Ils achètent un champ", "Ils vérifient le toit et demandent une autorisation", "Ils invitent un cuisinier"], 1], ["Pourquoi certaines plantes sèchent-elles ?", ["Personne ne sait ce qui a été planté", "L’organisation de l’arrosage ne fonctionne pas pendant les vacances", "Il pleut trop"], 1], ["Quelle est la principale leçon ?", ["Une bonne organisation est aussi nécessaire", "Les jardins échouent toujours", "Il ne faut pas parler aux voisins"], 0]], "summaries": ["Les voisins créent un jardin après avoir vérifié le toit et obtenu une autorisation. Un problème d’arrosage les pousse à mieux s’organiser.", "Julie plante sans consulter personne et la terrasse ferme à cause du poids.", "Les voisins abandonnent le jardin parce que toutes les plantes meurent."], "place": "🌱", "actors": ["👩", "👨"]}, {"title": "Le message manqué", "scenes": ["Nora et Alex préparaient une pièce pour la fête de l’école. Leur groupe répétait depuis trois semaines. Mercredi, leur professeur a déplacé la répétition du jeudi au vendredi, car la salle était indisponible.", "Alex a annoncé le changement dans la discussion du groupe. Nora n’a pas vu le message : elle avait désactivé les notifications pour réviser. Jeudi, elle est arrivée avec son costume et a trouvé la porte de la salle fermée.", "Elle a d’abord pensé que ses camarades l’avaient exclue. Elle a écrit un message en colère, mais avant de l’envoyer, elle a appelé Alex. Il lui a expliqué la situation et s’est excusé de ne pas avoir vérifié que tout le monde était au courant.", "Vendredi, Nora a participé à la répétition. Le groupe a décidé d’annoncer les changements importants à la fois dans la discussion et en classe. Nora était contente d’avoir posé une question avant de tirer des conclusions."], "q": [["Pourquoi la répétition est-elle déplacée ?", ["Nora ne veut pas participer", "La salle est indisponible", "Alex a perdu son costume"], 1], ["Qu’est-ce qui évite une dispute ?", ["Nora appelle avant d’envoyer son message", "Alex annule la pièce", "Le professeur ferme la discussion"], 0], ["Que décide le groupe ?", ["Arrêter les répétitions", "Annoncer les changements aussi en classe", "Envoyer uniquement des messages privés"], 1]], "summaries": ["Nora manque un changement de date et pense être exclue. Un appel permet de comprendre la situation, puis le groupe améliore sa communication.", "Les camarades excluent Nora et elle décide de quitter l’école.", "Nora déplace la répétition au jeudi et Alex se plaint de ne pas avoir reçu d’appel."], "place": "🎭", "actors": ["👧", "👦"]}], [{"title": "Une nouvelle trop belle pour être vraie", "scenes": ["Le journal du lycée a reçu un message promettant des transports gratuits pour tous les jeunes de la ville dès le mois suivant. Le sujet semblait idéal pour la une. Pourtant, le message ne renvoyait à aucune annonce officielle et la photo montrait un bus d’une autre ville.", "Certains rédacteurs voulaient publier immédiatement, mais Elena a proposé de vérifier. Elle a trouvé une proposition d’association, sans décision adoptée. Le document parlait d’ailleurs de réductions pour les élèves, et non de trajets gratuits pour tous les jeunes.", "L’équipe a appelé le service d’information de la ville. Un employé a confirmé qu’une mesure était à l’étude, mais que ni ses conditions ni sa date d’application n’étaient fixées. Elena a proposé un titre moins spectaculaire, distinguant clairement une proposition d’une décision définitive.", "Ils ont publié un article sur le débat, en précisant ce qui était confirmé et ce qui restait incertain. L’article a obtenu moins de vues que prévu, mais plusieurs lecteurs les ont remerciés pour leur clarté. L’équipe a compris qu’informer correctement exige parfois de renoncer à un titre accrocheur."], "q": [["Que découvre Elena ?", ["Une proposition existe, mais aucune décision n’est adoptée", "Les transports sont déjà gratuits", "L’association a fermé"], 0], ["Que confirme le service de la ville ?", ["La date exacte", "Une mesure est encore à l’étude", "Tous les bus seront remplacés"], 1], ["Que privilégie le journal ?", ["Les vues à tout prix", "La dissimulation des informations manquantes", "La distinction entre les faits confirmés et les incertitudes"], 2]], "summaries": ["L’équipe vérifie une nouvelle qui exagère une proposition non adoptée. Elle publie un article distinguant les faits confirmés des points encore incertains.", "Elena confirme la gratuité pour tous les jeunes dès le mois suivant et annonce la date.", "Le journal cesse de parler des transports parce que les lecteurs n’aiment pas les articles clairs."], "place": "📰", "actors": ["👩", "👨"]}, {"title": "Une bibliothèque pour tous", "scenes": ["La bibliothèque du quartier souhaitait attirer davantage d’adolescents. Sa directrice a proposé de transformer une pièce peu utilisée en espace de projets, de discussions et d’ateliers. Certains habitants ont apprécié l’idée, tandis que d’autres craignaient de perdre un des rares lieux calmes du quartier.", "Lors de la première réunion, les avis semblaient incompatibles. Marc, qui préparait ses examens, défendait le besoin de silence. Amina, animatrice d’un club de lecture, rappelait qu’une bibliothèque pouvait aussi être un lieu de rencontre. Ils s’accordaient cependant sur un point : l’espace devait rester accessible à tous.", "La directrice a proposé un essai de six semaines. Les ateliers auraient lieu à des horaires précis et la salle d’étude conserverait sa fonction. Des panneaux clairs seraient installés et les usagers pourraient donner leur avis sur le bruit et la fréquentation.", "À la fin de l’essai, un atelier particulièrement bruyant avait suscité des plaintes. Mais des jeunes qui ne fréquentaient jamais la bibliothèque avaient aussi participé. L’équipe a adapté les horaires et déplacé cet atelier ailleurs. La solution n’a pas supprimé tous les désaccords, mais elle a permis plusieurs usages tout en préservant le calme pour étudier."], "q": [["Sur quoi Marc et Amina sont-ils d’accord ?", ["Fermer la salle d’étude", "Garder un espace accessible à tous", "Interdire tous les ateliers"], 1], ["À quoi sert l’essai de six semaines ?", ["Évaluer les activités et leurs effets", "Vendre la bibliothèque", "Remplacer tous les livres"], 0], ["Que devient l’atelier bruyant ?", ["Les plaintes sont ignorées", "Tous les projets sont annulés", "Il est déplacé et les horaires sont adaptés"], 2]], "summaries": ["La bibliothèque teste de nouvelles activités en conservant la salle d’étude. Après les retours des usagers, elle adapte les horaires et déplace un atelier bruyant.", "La bibliothèque remplace la salle d’étude par des ateliers et abandonne la préparation aux examens.", "Tous les habitants rejettent l’essai et les activités sont annulées avant de commencer."], "place": "📚", "actors": ["👩", "👨"]}]];

let activeStory=null, activeMode='', questionIndex=0, sceneIndex=0, questionLocked=false, speechRun=0;
function stopMedia(){document.querySelectorAll("iframe.film-frame").forEach(f=>f.contentWindow?.postMessage("pause-film","*"));speechRun++;if(window.speechSynthesis)window.speechSynthesis.cancel();document.querySelectorAll('.actor').forEach(x=>x.classList.remove('speaking'))}
function mediaStatus(text){const el=document.getElementById('mediaStatus');if(el)el.textContent=text}
function speak(text){stopMedia();if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){mediaStatus('Die Sprachausgabe ist hier nicht verfügbar. Du kannst den Text einblenden und lesen.');return}const run=speechRun;const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=level===1?.8:level===2?.9:1;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase().startsWith('fr'));if(voice)u.voice=voice;u.onstart=()=>{if(run!==speechRun)return;mediaStatus('Die Geschichte wird vorgelesen.');document.querySelectorAll('.actor').forEach(x=>x.classList.add('speaking'))};u.onend=()=>{if(run!==speechRun)return;mediaStatus('Fertig. Du kannst noch einmal hören.');document.querySelectorAll('.actor').forEach(x=>x.classList.remove('speaking'))};u.onerror=()=>{if(run!==speechRun)return;mediaStatus('Die Stimme konnte nicht abgespielt werden. Bitte nutze den eingeblendeten Text.');document.querySelectorAll('.actor').forEach(x=>x.classList.remove('speaking'))};mediaStatus('Sprachausgabe wird gestartet …');try{window.speechSynthesis.speak(u)}catch(e){u.onerror()}}
function addControl(parent,label,action,cls=''){parent.appendChild(button(label,cls,action))}
function storyText(parent){const box=document.createElement('div');box.className='story-text';box.lang='fr';activeStory.scenes.forEach(t=>{const paragraph=document.createElement('p');paragraph.textContent=t;box.appendChild(paragraph)});parent.appendChild(box);return box}
function storyActivity(mode){activeStory=stories[level-1][round%stories[level-1].length];activeMode=mode;questionIndex=0;questionLocked=false;sceneIndex=0;const root=document.getElementById('content');root.replaceChildren();const title=document.createElement('h3');title.className='story-heading';title.textContent=activeStory.title;title.lang='fr';root.appendChild(title);
if(mode==='reading'||mode==='summary'){storyText(root)}
if(mode==='listening'){const tip=document.createElement('p');tip.className='reading-tip';tip.textContent='Höre zuerst die Geschichte. Die Stimme kommt von deinem Gerät; Qualität und Verfügbarkeit können variieren. Du kannst beliebig oft hören oder den Text als Hilfe einblenden.';root.appendChild(tip);const controls=document.createElement('div');controls.className='activity-controls';root.appendChild(controls);addControl(controls,'▶ Geschichte anhören',()=>speak(activeStory.scenes.join(' ')),'primary');addControl(controls,'■ Stoppen',()=>{stopMedia();mediaStatus('Wiedergabe gestoppt.')});const transcript=document.createElement('div');transcript.id='transcript';transcript.hidden=true;storyText(transcript);addControl(controls,'Text einblenden',b=>{transcript.hidden=!transcript.hidden;b.textContent=transcript.hidden?'Text einblenden':'Text ausblenden'});root.appendChild(transcript);const status=document.createElement('p');status.id='mediaStatus';status.className='media-status';status.setAttribute('role','status');root.appendChild(status)}
if(mode==='cinema'){const tip=document.createElement('p');tip.className='reading-tip';tip.textContent='Ein gezeichneter Trickfilm mit französischen Dialogen. Die Stimme hängt von deinem Gerät ab; Untertitel sind immer sichtbar. Danach kannst du die Fragen öffnen.';root.appendChild(tip);const frame=document.createElement('iframe');frame.className='film-frame';frame.title=activeStory.title+' – Trickfilm';frame.srcdoc=filmDocument(level,round%2);root.appendChild(frame);const controls=document.createElement('div');controls.className='activity-controls';root.appendChild(controls);addControl(controls,'Fragen zum Film öffnen',()=>{stopMedia();const questions=document.getElementById('storyQuestions');questions.hidden=false;if(!questions.children.length)renderQuestion();questions.scrollIntoView?.({behavior:'smooth',block:'start'})},'primary')}
const questions=document.createElement('div');questions.id='storyQuestions';root.appendChild(questions);if(mode==='cinema'){questions.hidden=true}else if(mode==='summary')renderRésumé();else renderQuestion()}
function renderScene(){stopMedia();const parent=document.getElementById('scene');parent.replaceChildren();const count=document.createElement('p');count.className='question-number';count.textContent='Szene '+(sceneIndex+1)+' von '+activeStory.scenes.length;parent.appendChild(count);const stage=document.createElement('div');stage.className='cinema-stage';stage.setAttribute('aria-hidden','true');const place=document.createElement('div');place.className='scene-place';place.textContent=activeStory.place;stage.appendChild(place);activeStory.actors.forEach(a=>{const actor=document.createElement('div');actor.className='actor';actor.textContent=a;stage.appendChild(actor)});parent.appendChild(stage);const caption=document.createElement('p');caption.className='scene-caption';caption.lang='fr';caption.textContent=activeStory.scenes[sceneIndex];parent.appendChild(caption);const controls=document.createElement('div');controls.className='activity-controls';parent.appendChild(controls);addControl(controls,'◀ Zurück',()=>{sceneIndex--;renderScene()});controls.lastChild.disabled=sceneIndex===0;addControl(controls,'▶ Szene anhören',()=>speak(activeStory.scenes[sceneIndex]));addControl(controls,'■ Stoppen',()=>{stopMedia();mediaStatus('Wiedergabe gestoppt.')});if(sceneIndex<activeStory.scenes.length-1)addControl(controls,'Nächste Szene →',()=>{sceneIndex++;renderScene()},'primary');else addControl(controls,'Zu den Fragen →',()=>{stopMedia();document.getElementById('storyQuestions').hidden=false;renderQuestion();document.getElementById('storyQuestions').scrollIntoView?.({behavior:'smooth',block:'start'})},'primary');const status=document.createElement('p');status.className='media-status';status.id='mediaStatus';status.setAttribute('role','status');parent.appendChild(status)}
function renderQuestion(){questionLocked=false;const root=document.getElementById('storyQuestions');root.replaceChildren();const count=document.createElement('p');count.className='question-number';count.textContent='Frage '+(questionIndex+1)+' von '+activeStory.q.length;root.appendChild(count);const q=activeStory.q[questionIndex];const title=document.createElement('h3');title.lang='fr';title.textContent=q[0];root.appendChild(title);const options=document.createElement('div');options.className='story-options';root.appendChild(options);shuffled(q[1].map((text,index)=>({text,index}))).forEach(x=>{const b=button(x.text,'choice',el=>answerQuestion(el,x.index));b.lang='fr';options.appendChild(b)})}
function answerQuestion(el,index){if(advancing||questionLocked)return;clearChoices();if(index!==activeStory.q[questionIndex][2]){el.classList.add('wrong');fb('Noch nicht. Prüfe die Geschichte und versuch es erneut.',false);return}el.classList.add('correct');questionLocked=true;if(questionIndex===activeStory.q.length-1){win();return}fb('Bonne réponse ! Weiter zur nächsten Frage.',true);addControl(document.getElementById('storyQuestions'),'Nächste Frage →',()=>{if(advancing)return;questionIndex++;fb('',true);renderQuestion()},'primary')}
function renderRésumé(){const root=document.getElementById('storyQuestions');const h=document.createElement('h3');h.textContent='Quel résumé est correct ?';h.lang='fr';root.appendChild(h);const options=document.createElement('div');options.className='story-options';root.appendChild(options);shuffled(activeStory.summaries.map((text,index)=>({text,index}))).forEach(x=>{const b=button(x.text,'choice',el=>{if(advancing)return;clearChoices();if(x.index===0){el.classList.add('correct');win()}else{el.classList.add('wrong');fb('Diese Zusammenfassung verändert wichtige Details. Lies noch einmal.',false)}});b.lang='fr';options.appendChild(b)})}
function mission(){const task=missions[level-1][round%missions[level-1].length];document.getElementById('content').innerHTML='<h3 id="missionTitle" class="story-heading"></h3><p id="missionPrompt" class="scene-caption" lang="fr"></p><div id="missionChoices" class="story-options"></div>';document.getElementById('missionTitle').textContent='💬 '+task[0];document.getElementById('missionPrompt').textContent=task[1];shuffled(task[2].map((text,index)=>({text,index}))).forEach(x=>{const b=button(x.text,'choice',el=>{if(advancing)return;clearChoices();if(x.index===task[3]){el.classList.add('correct');win();fb('Bravo ! '+task[4]+' +10 ⭐',true)}else{el.classList.add('wrong');fb('Passt das zur Situation? Versuch es noch einmal.',false)}});b.lang='fr';document.getElementById('missionChoices').appendChild(b)})}
